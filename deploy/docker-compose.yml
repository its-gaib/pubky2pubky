services:
  rendezvous:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      HPK_BIND: 0.0.0.0:8080
      HPK_RELAY_AUTH_SECRET: ${HPK_RELAY_AUTH_SECRET:?set HPK_RELAY_AUTH_SECRET to a random value}
      HPK_ALLOWED_ORIGINS: ${HPK_ALLOWED_ORIGINS:-}
      HPK_MAX_SESSIONS: ${HPK_MAX_SESSIONS:-10000}
      HPK_MAX_CONNECTIONS_PER_IDENTITY: ${HPK_MAX_CONNECTIONS_PER_IDENTITY:-16}
      HPK_MAX_CONNECTIONS: ${HPK_MAX_CONNECTIONS:-10000}
      HPK_MAX_REGISTRATION_NONCES: ${HPK_MAX_REGISTRATION_NONCES:-50000}
      RUST_LOG: ${RUST_LOG:-hole_punchky_rendezvous=info,tower_http=info}
    ports:
      - "${HPK_RENDEZVOUS_BIND:-127.0.0.1}:${HPK_RENDEZVOUS_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  iroh-relay:
    build:
      context: ..
      dockerfile: deploy/iroh-relay.Dockerfile
    restart: unless-stopped
    environment:
      IROH_RELAY_HTTP_BEARER_TOKEN: ${HPK_RELAY_AUTH_SECRET:?set HPK_RELAY_AUTH_SECRET to a random value}
    ports:
      - "${HPK_IROH_RELAY_BIND:-127.0.0.1}:${HPK_IROH_RELAY_PORT:-3340}:3340"
      - "${HPK_IROH_QAD_BIND:-0.0.0.0}:${HPK_IROH_QAD_PORT:-7842}:7842/udp"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3340/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      rendezvous:
        condition: service_healthy

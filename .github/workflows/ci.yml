name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  specifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --ignore-scripts
      - run: npm run lint:schemas

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@839ed2261f110eedd370cb037b6038e074512c4e # 1.91.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: shellcheck scripts/*.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - name: Discover runner address
        run: |
          runner_ip=$(ip -4 route get 1.1.1.1 | sed -n 's/.* src \([^ ]*\).*/\1/p' | head -n 1)
          test -n "$runner_ip"
          echo "HPK_RUNNER_IP=$runner_ip" >> "$GITHUB_ENV"
      - name: Start iroh relay and rendezvous for two-NAT test
        run: |
          docker build --file deploy/iroh-relay.Dockerfile \
            --tag hole-punchky-ci-iroh-relay .
          docker run --detach --name hole-punchky-ci-iroh-relay --network host \
            --add-host rendezvous:127.0.0.1 \
            --env IROH_RELAY_HTTP_BEARER_TOKEN=hole-punchky-ci-relay-secret \
            hole-punchky-ci-iroh-relay
          docker cp hole-punchky-ci-iroh-relay:/etc/iroh-relay/relay.crt \
            /tmp/hole-punchky-ci-relay.crt
          cargo build -p hole-punchky
          target/debug/hole-punchky serve --bind 0.0.0.0:8080 \
            --relay-auth-secret hole-punchky-ci-relay-secret \
            >/tmp/hole-punchky-ci-rendezvous.log 2>&1 &
          echo "$!" >/tmp/hole-punchky-ci-rendezvous.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz \
              && curl --fail --silent http://127.0.0.1:3340/healthz; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hole-punchky-ci-rendezvous.log
          docker logs hole-punchky-ci-iroh-relay
          exit 1
      - name: Test direct traversal across two NATs
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo env \
            HPK_BIN="$GITHUB_WORKSPACE/target/debug/hole-punchky" \
            HPK_RENDEZVOUS_CONNECT_IP="$HPK_RUNNER_IP" \
            HPK_RENDEZVOUS_CONNECT_PORT=8080 \
            HPK_IROH_RELAY_CONNECT_PORT=3340 \
            HPK_IROH_RELAY_CA=/tmp/hole-punchky-ci-relay.crt \
            "$GITHUB_WORKSPACE/scripts/nat-lab.sh"
      - name: Show infrastructure logs on failure
        if: failure()
        run: |
          docker logs hole-punchky-ci-iroh-relay 2>/dev/null || true
          cat /tmp/hole-punchky-ci-rendezvous.log 2>/dev/null || true
      - name: Stop test infrastructure
        if: always()
        run: |
          if test -f /tmp/hole-punchky-ci-rendezvous.pid; then
            kill "$(cat /tmp/hole-punchky-ci-rendezvous.pid)" 2>/dev/null || true
          fi
          docker rm --force hole-punchky-ci-iroh-relay 2>/dev/null || true

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate Compose configuration
        env:
          HPK_RELAY_AUTH_SECRET: compose-validation-only
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: hole-punchky-rendezvous:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/iroh-relay.Dockerfile
          push: false
          tags: hole-punchky-iroh-relay:test

[workspace]
members = [
    "crates/browser-wasm",
    "crates/client",
    "crates/protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/its-gaib/pubky2pubky"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = "3.0"
futures-util = "0.3"
iroh = { version = "=1.1.0", default-features = false, features = ["portmapper", "tls-ring"] }
n0-future = "0.3.2"
pubky = { version = "0.11", features = ["json"] }
pubky-common = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
web-time = "1.1"
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

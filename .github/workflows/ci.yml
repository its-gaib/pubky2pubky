name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1d1eb14921d9c2d8ea575663e5fe3a0b57868a05 # 1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - name: Start coturn for forced-relay test
        run: |
          docker run --detach --name hole-punchky-ci-turn --network host \
            coturn/coturn:4.6.3-r3-alpine@sha256:e2bca2f79a4269d7240de5872ab60a9305013ad37296d2acf14f9510874346be \
            --no-cli --log-file=stdout --fingerprint --no-multicast-peers \
            --use-auth-secret --static-auth-secret=hole-punchky-ci-secret \
            --realm=hole-punchky.test --listening-port=3478 \
            --min-port=49160 --max-port=49200
          for attempt in {1..20}; do
            if docker exec hole-punchky-ci-turn \
              turnutils_stunclient 127.0.0.1 -p 3478; then
              exit 0
            fi
            sleep 1
          done
          docker logs hole-punchky-ci-turn
          exit 1
      - name: Test forced TURN relay
        env:
          HPK_TEST_TURN_URL: turn:127.0.0.1:3478?transport=udp
          HPK_TEST_TURN_SECRET: hole-punchky-ci-secret
        run: cargo test -p hole-punchky-client --test e2e forced_turn_path_relays_data_channel -- --ignored
      - name: Show coturn logs on failure
        if: failure()
        run: docker logs hole-punchky-ci-turn
      - name: Stop coturn
        if: always()
        run: docker rm --force hole-punchky-ci-turn

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: hole-punchky-rendezvous:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

openapi: 3.1.0
info:
  title: Hole Punchky rendezvous HTTP surface
  version: 2.0.0
  description: The signaling protocol on /v2/ws is specified in asyncapi.yaml.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://rendezvous.invalid
    description: Replace with the rendezvous deployment's public origin.
security: []
paths:
  /healthz:
    get:
      summary: Check rendezvous process health
      operationId: health
      responses:
        "200":
          description: Process is serving.
          content:
            application/json:
              schema:
                type: object
                required: [status, protocol_version]
                properties:
                  status: { const: ok }
                  protocol_version: { const: 2 }
        "405": { description: Method not allowed }
  /v2/config:
    get:
      summary: Read public transport and protocol configuration
      operationId: publicConfig
      responses:
        "200":
          description: Non-secret transport and limit information.
          content:
            application/json:
              schema:
                type: object
                required:
                  - protocol_version
                  - transport
                  - consent_required
                  - relay_access_managed
                  - session_ttl_seconds
                  - max_message_bytes
                properties:
                  protocol_version: { const: 2 }
                  transport: { const: iroh-quic-v1 }
                  consent_required: { const: true }
                  relay_access_managed: { type: boolean }
                  session_ttl_seconds: { type: integer, minimum: 1 }
                  max_message_bytes: { type: integer, minimum: 1024 }
        "405": { description: Method not allowed }
  /metrics:
    get:
      summary: Read Prometheus metrics
      operationId: prometheusMetrics
      responses:
        "200":
          description: Prometheus 0.0.4 text exposition.
          content:
            text/plain:
              schema: { type: string }
        "405": { description: Method not allowed }
  /v2/ws:
    get:
      summary: Upgrade to the signaling WebSocket protocol
      operationId: signalingWebSocketUpgrade
      responses:
        "101": { description: WebSocket protocol switch }
        "403": { description: Origin rejected by configured policy }
  /internal/relay/authorize:
    post:
      summary: Authorize an iroh endpoint currently registered over WebSocket
      description: Internal-only callback for the official iroh relay HTTP access-control mode.
      operationId: authorizeRelayEndpoint
      security:
        - relayCalloutToken: []
      parameters:
        - name: X-Iroh-NodeId
          in: header
          required: true
          description: Header emitted by the pinned iroh-relay 1.1 binary.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Endpoint is currently registered with a valid Pubky device delegation.
          content:
            text/plain:
              schema: { const: "true" }
        "403": { description: Callout authentication failed or endpoint is not registered. }
        "404": { description: Managed relay authorization is disabled. }
components:
  securitySchemes:
    relayCalloutToken:
      type: http
      scheme: bearer

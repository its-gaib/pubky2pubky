asyncapi: 3.1.0
info:
  title: Hole Punchky rendezvous WebSocket
  version: 2.0.0
  description: >-
    Consent-first, authenticated routing for an HPKE-encrypted iroh endpoint address.
    Cryptographic construction and state ordering are normative in protocol.md.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  production:
    host: connect.example.com
    pathname: /v2/ws
    protocol: wss
channels:
  rendezvous:
    address: /v2/ws
    messages:
      clientFrame: { $ref: "#/components/messages/ClientFrame" }
      serverFrame: { $ref: "#/components/messages/ServerFrame" }
operations:
  sendClientFrame:
    action: send
    channel: { $ref: "#/channels/rendezvous" }
    messages:
      - { $ref: "#/channels/rendezvous/messages/clientFrame" }
  receiveServerFrame:
    action: receive
    channel: { $ref: "#/channels/rendezvous" }
    messages:
      - { $ref: "#/channels/rendezvous/messages/serverFrame" }
components:
  messages:
    ClientFrame:
      payload: { $ref: "#/components/schemas/ClientFrame" }
    ServerFrame:
      payload: { $ref: "#/components/schemas/ServerFrame" }
  schemas:
    ClientFrame:
      oneOf:
        - $ref: "#/components/schemas/RegisterFrame"
        - $ref: "#/components/schemas/KnockFrame"
        - $ref: "#/components/schemas/AcceptFrame"
        - $ref: "#/components/schemas/RejectFrame"
        - $ref: "#/components/schemas/SignalFrame"
        - type: object
          required: [type, data]
          properties:
            type: { const: ping }
            data:
              type: object
              required: [nonce]
              properties: { nonce: { type: string, maxLength: 256 } }
    ServerFrame:
      type: object
      required: [type, data]
      properties:
        type:
          enum: [registered, knock, accepted, rejected, signal, pong, error]
        data: { type: object }
    RegisterFrame:
      $ref: "#/components/schemas/AuthenticatedFrame"
      description: type is register; payload signing domain is hole-punchky/register/v2.
    KnockFrame:
      $ref: "#/components/schemas/AuthenticatedFrame"
      description: type is knock; payload signing domain is hole-punchky/knock/v2.
    AcceptFrame:
      $ref: "#/components/schemas/AuthenticatedFrame"
      description: type is accept; payload signing domain is hole-punchky/accept/v2.
    RejectFrame:
      $ref: "#/components/schemas/AuthenticatedFrame"
      description: type is reject; payload signing domain is hole-punchky/reject/v2.
    AuthenticatedFrame:
      type: object
      required: [type, data]
      properties:
        type: { type: string }
        data:
          type: object
          required: [payload, certificate, signature]
          properties:
            payload: { type: object }
            certificate: { $ref: "#/components/schemas/DeviceCertificate" }
            signature: { $ref: "#/components/schemas/Base64Url" }
    DeviceCertificate:
      type: object
      required: [claims, signature]
      properties:
        claims:
          type: object
          required:
            - version
            - identity
            - device_id
            - signing_key
            - encryption_key
            - iroh_endpoint_id
            - issued_at
            - expires_at
            - capabilities
          properties:
            version: { const: 2 }
            identity: { $ref: "#/components/schemas/PubkyIdentity" }
            device_id: { type: string, minLength: 1, maxLength: 128 }
            signing_key: { $ref: "#/components/schemas/PubkyIdentity" }
            encryption_key: { $ref: "#/components/schemas/Base64Url" }
            iroh_endpoint_id: { $ref: "#/components/schemas/PubkyIdentity" }
            issued_at: { type: integer, minimum: 0 }
            expires_at: { type: integer, minimum: 1 }
            capabilities:
              type: array
              items: { type: string }
        signature: { $ref: "#/components/schemas/Base64Url" }
    SignalFrame:
      type: object
      required: [type, data]
      properties:
        type: { const: signal }
        data:
          type: object
          required: [header, certificate, encapsulated_key, ciphertext, signature]
          properties:
            header:
              type: object
              required:
                - version
                - session_id
                - from_identity
                - from_device_id
                - to_identity
                - to_device_id
                - sequence
                - kind
                - issued_at
                - expires_at
              properties:
                version: { const: 2 }
                session_id: { type: string, format: uuid }
                from_identity: { $ref: "#/components/schemas/PubkyIdentity" }
                from_device_id: { type: string }
                to_identity: { $ref: "#/components/schemas/PubkyIdentity" }
                to_device_id: { type: string }
                sequence: { const: 0 }
                kind: { enum: [iroh_endpoint, abort] }
                issued_at: { type: integer, minimum: 0 }
                expires_at: { type: integer, minimum: 1 }
            certificate: { $ref: "#/components/schemas/DeviceCertificate" }
            encapsulated_key: { $ref: "#/components/schemas/Base64Url" }
            ciphertext: { $ref: "#/components/schemas/Base64Url" }
            signature: { $ref: "#/components/schemas/Base64Url" }
    IrohEndpointAddressPlaintext:
      description: This object appears only inside the HPKE ciphertext after target consent.
      type: object
      required: [endpoint_id, relay_urls, direct_addresses]
      properties:
        endpoint_id: { $ref: "#/components/schemas/PubkyIdentity" }
        relay_urls:
          type: array
          maxItems: 8
          items: { type: string, format: uri }
        direct_addresses:
          type: array
          maxItems: 32
          items: { type: string }
    PubkyIdentity:
      type: string
      pattern: "^[ybndrfg8ejkmcpqxot1uwisza345h769]{52}$"
    Base64Url:
      type: string
      pattern: "^[A-Za-z0-9_-]+$"
